# A 4th model server that joins the same InferencePool (label app: vllm-qwen3-32b)
# but pretends to be overloaded:
#   --fake-metrics          : reports 15 running requests, 20 queued requests and 95% KV-cache usage
#                             on its /metrics endpoint (this is what the Endpoint Picker scrapes)
#   --time-to-first-token   : every response takes 3 seconds, like a real overloaded GPU would
# A Kubernetes Service cannot see any of this. The Endpoint Picker can.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-32b-hot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen3-32b
      role: hot
  template:
    metadata:
      labels:
        app: vllm-qwen3-32b
        role: hot
        inference.networking.k8s.io/engine-type: vllm
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
        imagePullPolicy: IfNotPresent
        args:
        - --model
        - Qwen/Qwen3-32B
        - --port
        - "8000"
        - --max-loras
        - "2"
        - --lora-modules
        - '{"name": "food-review-1"}'
        - --fake-metrics
        - '{"running-requests":15,"waiting-requests":20,"kv-cache-usage":0.95}'
        - --time-to-first-token=3000
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
